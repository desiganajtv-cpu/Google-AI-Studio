<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Tasks — Advanced Shared Work Management</title>
    <meta name="description" content="An advanced, minimalist shared office to-do list for colleagues to capture, schedule, prioritize, and track work effortlessly." />
    <meta property="og:title" content="Office Tasks — Advanced Shared Work Management" />
    <meta property="og:description" content="An advanced, minimalist shared office to-do list for colleagues to capture, schedule, prioritize, and track work effortlessly." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("office_tasks_settings_v1");
          var theme = saved ? JSON.parse(saved).theme : "system";
          var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#DCDCE0] dark:bg-[#141416] text-[#1C1C1F] dark:text-[#F3F3F5] antialiased font-sans transition-colors duration-200 selection:bg-[#1C1C1F] selection:text-white dark:selection:bg-white dark:selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
